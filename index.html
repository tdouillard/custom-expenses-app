<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dépenses &amp; remboursements</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="config.js"></script>
  <script type="module" src="src/main.js"></script>
</head>
<body x-data="appShell">
  <p class="splash" x-show="!$store.auth.ready">Chargement…</p>

  <div x-cloak x-show="$store.auth.ready && !$store.auth.user && page === 'login'" data-include="src/components/login/login.html"></div>

  <div x-cloak x-show="$store.auth.ready && !$store.auth.user && page === 'forgot-password'" data-include="src/components/forgot-password/forgot-password.html" x-data="forgotPasswordPage()"></div>

  <div x-cloak x-show="$store.auth.user">
    <div data-include="src/components/app-shell/header.html"></div>
    <p class="banner" role="alert" x-cloak x-show="$store.data.error" x-text="$store.data.error"></p>

    <main class="dashboard" x-show="$store.admin.view === 'dashboard'">
      <div class="span-8" data-include="src/components/balances/balances.html"></div>
      <div class="span-4" data-include="src/components/settlements/settlements.html" x-data="settlementsCard"></div>
      <div class="span-12" data-include="src/components/expenses/expenses.html" x-data="expenses"></div>
      <div class="span-8" data-include="src/components/totals/totals.html"></div>
      <div class="span-4 stack">
        <div data-include="src/components/collection-card/collection-card.html" x-data="collectionCard('members')"></div>
        <div data-include="src/components/collection-card/collection-card.html" x-data="collectionCard('events')"></div>
      </div>
    </main>

    <main class="admin-page" x-cloak x-show="$store.admin.isAdmin && $store.admin.view === 'admin'"
          data-include="src/components/admin/admin.html" x-data="adminPage"></main>

    <main class="account-page" x-cloak x-show="$store.admin.view === 'account'"
          data-include="src/components/account/account.html" x-data="accountPage"></main>

    <div data-include="src/components/expense-dialog/expense-dialog.html" x-data="expenseDialog" @open-expense.window="open($event.detail)"></div>
    <div data-include="src/components/settle-dialog/settle-dialog.html" x-data="settleDialog" @open-settle.window="open()"></div>
    <div data-include="src/components/share-dialog/share-dialog.html" x-data="shareDialog" @open-share.window="open()"></div>
    <div data-include="src/components/import-dialog/import-dialog.html" x-data="importDialog" @open-import.window="open()"></div>
    <div data-include="src/components/manage-dialog/manage-dialog.html" x-data="manageDialog" @open-manage.window="open($event.detail)"></div>
  </div>
</body>
</html>
