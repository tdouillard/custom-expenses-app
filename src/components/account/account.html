<div class="account">
  <section class="card">
    <h2 x-text="$t('account.profile')"></h2>
    <div class="account-id">
      <span class="avatar avatar-lg" x-text="$store.auth.initials"></span>
      <div>
        <b x-text="$store.auth.displayName"></b>
        <span class="muted" x-text="$store.auth.user?.email"></span>
        <span class="muted" x-text="$store.admin.isAdmin ? $t('role.admin') : $t('role.member')"></span>
      </div>
    </div>
    <form class="stack-form" id="account-profile-form" @submit.prevent="saveProfile()">
      <label><span x-text="$t('account.username')"></span>
        <input name="username" autocomplete="nickname" maxlength="40" x-model="username">
      </label>
      <label><span x-text="$t('account.language')"></span>
        <select name="language" x-model="language">
          <template x-for="l in $store.i18n.languages" :key="l.code">
            <option :value="l.code" x-text="l.label"></option>
          </template>
        </select>
      </label>
      <p class="ok" role="status" x-show="profile.ok" x-text="profile.ok"></p>
      <p class="form-error" role="alert" x-show="profile.error" x-text="profile.error"></p>
      <button class="primary" type="submit" :disabled="profile.busy" x-text="$t('common.save')"></button>
    </form>
  </section>

  <section class="card">
    <h2 x-text="$t('account.email')"></h2>
    <p class="hint" x-text="$t('account.currentEmail', { email: $store.auth.user?.email })"></p>
    <p class="notice" x-show="$store.auth.user?.new_email"
       x-text="$t('account.pendingEmail', { email: $store.auth.user?.new_email })"></p>
    <form class="stack-form" id="account-email-form" @submit.prevent="changeEmail()">
      <label><span x-text="$t('account.newEmail')"></span>
        <input type="email" name="new-email" autocomplete="email" required x-model="email">
      </label>
      <p class="ok" role="status" x-show="emailState.ok" x-text="emailState.ok"></p>
      <p class="form-error" role="alert" x-show="emailState.error" x-text="emailState.error"></p>
      <button class="primary" type="submit" :disabled="emailState.busy" x-text="$t('account.changeEmail')"></button>
    </form>
  </section>

  <section class="card">
    <h2 x-text="$t('account.password')"></h2>
    <p class="hint" x-text="$t('account.passwordHint')"></p>
    <p class="ok" role="status" x-show="passwordState.ok" x-text="passwordState.ok"></p>
    <p class="form-error" role="alert" x-show="passwordState.error" x-text="passwordState.error"></p>
    <button type="button" id="forgot-password-btn" @click="forgotPassword()" :disabled="passwordState.busy" x-text="$t('auth.forgotPassword')"></button>
  </section>
</div>
