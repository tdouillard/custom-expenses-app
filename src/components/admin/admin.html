<div class="admin">
  <p class="banner" role="alert" x-cloak x-show="$store.admin.error" x-text="$store.admin.error"></p>

  <div class="admin-toolbar">
    <template x-if="!editing">
      <button class="primary" type="button" id="admin-edit" @click="startEdit()">✏️ Modifier</button>
    </template>
    <template x-if="editing">
      <div class="inline">
        <button class="primary" type="button" id="admin-save" :disabled="saving" @click="save()" x-text="saving ? 'Enregistrement…' : 'Enregistrer'"></button>
        <button type="button" id="admin-cancel" :disabled="saving" @click="cancel()">Annuler</button>
      </div>
    </template>
  </div>
  <div class="form-error" role="alert" x-cloak x-show="formError" x-text="formError"></div>

  <section class="card">
    <h2>Utilisateurs</h2>

    <template x-if="!editing">
      <ul class="admin-list" id="admin-users">
        <template x-for="u in $store.admin.users" :key="u.id">
          <li class="admin-row">
            <div class="admin-head">
              <b x-text="u.name || u.email"></b>
              <span class="muted" x-show="u.name" x-text="u.email"></span>
              <span class="chip" x-show="u.is_admin">Administrateur</span>
            </div>
            <div class="chips">
              <span class="muted">Membre :</span>
              <span class="chip" x-show="memberOf(u.id)" x-text="memberOf(u.id)"></span>
              <span class="muted" x-show="!memberOf(u.id)">Aucun</span>
            </div>
            <div class="chips" x-show="!u.is_admin">
              <template x-for="ev in $store.admin.eventsOf(u.id)" :key="ev.id"><span class="chip" x-text="ev.name"></span></template>
              <span class="muted" x-show="!$store.admin.eventsOf(u.id).length">Aucun événement</span>
            </div>
            <span class="muted" x-show="u.is_admin">Accès à tous les événements</span>
          </li>
        </template>
        <li class="muted" x-show="!$store.admin.users.length">Aucun utilisateur</li>
      </ul>
    </template>

    <template x-if="editing">
      <div>
        <ul class="admin-list" id="admin-users-edit">
          <template x-for="u in draftUsers" :key="u.id">
            <li class="admin-row">
              <div class="admin-head">
                <b x-text="u.email"></b>
                <span class="chip" x-show="u.isNew">Nouveau</span>
                <label class="check">
                  <input type="checkbox" class="admin-flag" x-model="u.is_admin" :disabled="u.id === $store.auth.user?.id">
                  Administrateur
                </label>
                <button class="icon-btn" type="button" x-show="u.isNew" :aria-label="'Retirer ' + u.email" @click="removeNewUser(u)">✕</button>
              </div>
              <div class="inline">
                <input class="admin-name" placeholder="Nom affiché" x-model="u.name" :aria-label="'Nom de ' + u.email">
                <select class="admin-member" x-model="u.member" :aria-label="'Membre de ' + u.email">
                  <option value="">Aucun membre associé</option>
                  <template x-for="m in memberOptions(u)" :key="m"><option :value="m" :selected="m === u.member" x-text="m"></option></template>
                </select>
              </div>
              <div class="chips" x-show="!u.is_admin">
                <template x-for="ev in draft.events" :key="ev.id">
                  <label class="check chip">
                    <input type="checkbox" class="admin-access" :checked="has(u.id, ev.id)" @change="toggle(u.id, ev.id)">
                    <span x-text="ev.name || '…'"></span>
                  </label>
                </template>
                <span class="muted" x-show="!draft.events.length">Aucun événement</span>
              </div>
              <span class="muted" x-show="u.is_admin">Accès à tous les événements</span>
            </li>
          </template>
        </ul>

        <form class="admin-add" id="admin-user-form" @submit.prevent="addUser()">
          <h3>Ajouter un utilisateur</h3>
          <div class="inline">
            <input type="email" name="user-email" placeholder="Email" x-model="newUser.email" required>
            <input type="password" name="user-password" placeholder="Mot de passe" autocomplete="new-password" x-model="newUser.password" required>
          </div>
          <div class="inline">
            <input name="user-name" placeholder="Nom affiché (optionnel)" x-model="newUser.name">
            <select name="user-member" x-model="newUser.member">
              <option value="">Aucun membre associé</option>
              <template x-for="m in memberOptions(null)" :key="m"><option :value="m" x-text="m"></option></template>
            </select>
            <button type="submit">+ Ajouter</button>
          </div>
          <p class="hint">Le membre choisi est remplacé par l’utilisateur : il en prend le nom et conserve ses dépenses.</p>
        </form>
      </div>
    </template>
  </section>

  <section class="card">
    <h2>Événements</h2>

    <template x-if="!editing">
      <ul class="admin-list" id="admin-events">
        <template x-for="ev in $store.admin.events" :key="ev.id">
          <li class="admin-row">
            <div class="admin-head">
              <b x-text="ev.name"></b>
              <span class="muted" x-text="$fmt.fmtDate(ev.date) || 'Sans date'"></span>
              <span class="muted" x-text="ev.expenseCount + ' dépense(s)'"></span>
            </div>
            <div class="chips">
              <template x-for="u in usersOfEvent(ev.id)" :key="u.id"><span class="chip" x-text="u.name || u.email"></span></template>
              <span class="muted" x-show="!usersOfEvent(ev.id).length">Personne</span>
            </div>
          </li>
        </template>
        <li class="muted" x-show="!$store.admin.events.length">Aucun événement</li>
      </ul>
    </template>

    <template x-if="editing">
      <div>
        <ul class="admin-list" id="admin-events-edit">
          <template x-for="ev in draft.events" :key="ev.id">
            <li class="admin-row">
              <div class="inline">
                <input class="admin-event-name" x-model="ev.name" :aria-label="'Nom de l’événement'" required>
                <input type="date" x-model="ev.date" aria-label="Date">
                <span class="muted" x-text="ev.expenseCount + ' dépense(s)'"></span>
                <button class="icon-btn" type="button" :aria-label="'Supprimer ' + ev.name" @click="removeEvent(ev)">🗑️</button>
              </div>
            </li>
          </template>
          <li class="muted" x-show="!draft.events.length">Aucun événement</li>
        </ul>
        <form class="inline admin-add" id="admin-event-form" @submit.prevent="addEvent()">
          <input name="event-name" placeholder="Nom de l'événement" x-model="newEvent.name">
          <input type="date" name="event-date" x-model="newEvent.date">
          <button type="submit">+ Ajouter</button>
        </form>
      </div>
    </template>
  </section>
</div>
