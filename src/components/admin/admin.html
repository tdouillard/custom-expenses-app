<div class="admin">
  <p class="banner" role="alert" x-cloak x-show="$store.admin.error" x-text="$store.admin.error"></p>

  <div class="admin-toolbar">
    <template x-if="!editing">
      <button class="primary" type="button" id="admin-edit" @click="startEdit()" x-text="'✏️ ' + $t('common.edit')"></button>
    </template>
    <template x-if="editing">
      <div class="inline">
        <button class="primary" type="button" id="admin-save" :disabled="saving" @click="save()" x-text="saving ? $t('common.saving') : $t('common.save')"></button>
        <button type="button" id="admin-cancel" :disabled="saving" @click="cancel()" x-text="$t('common.cancel')"></button>
      </div>
    </template>
  </div>
  <div class="form-error" role="alert" x-cloak x-show="formError" x-text="formError"></div>

  <section class="card">
    <h2 x-text="$t('admin.users')"></h2>

    <template x-if="!editing">
      <ul class="admin-list" id="admin-users">
        <template x-for="u in $store.admin.users" :key="u.id">
          <li class="admin-row">
            <div class="admin-head">
              <b x-text="u.name || u.email"></b>
              <span class="muted" x-show="u.name" x-text="u.email"></span>
              <span class="chip" x-show="u.is_admin" x-text="$t('role.admin')"></span>
            </div>
            <div class="chips">
              <span class="muted" x-text="$t('admin.memberLabel')"></span>
              <span class="chip" x-show="memberOf(u.id)" x-text="memberOf(u.id)"></span>
              <span class="muted" x-show="!memberOf(u.id)" x-text="$t('common.none')"></span>
            </div>
            <div class="chips" x-show="!u.is_admin">
              <template x-for="ev in $store.admin.eventsOf(u.id)" :key="ev.id"><span class="chip" x-text="ev.name"></span></template>
              <span class="muted" x-show="!$store.admin.eventsOf(u.id).length" x-text="$t('admin.noEvents')"></span>
            </div>
            <span class="muted" x-show="u.is_admin" x-text="$t('admin.allEventsAccess')"></span>
          </li>
        </template>
        <li class="muted" x-show="!$store.admin.users.length" x-text="$t('common.none')"></li>
      </ul>
    </template>

    <template x-if="editing">
      <div>
        <ul class="admin-list" id="admin-users-edit">
          <template x-for="u in draftUsers" :key="u.id">
            <li class="admin-row">
              <div class="admin-head">
                <b x-text="u.email"></b>
                <span class="chip" x-show="u.isNew" x-text="$t('admin.newBadge')"></span>
                <label class="check">
                  <input type="checkbox" class="admin-flag" x-model="u.is_admin" :disabled="u.id === $store.auth.user?.id">
                  <span x-text="$t('role.admin')"></span>
                </label>
                <button class="icon-btn" type="button" x-show="u.isNew" :aria-label="$t('admin.removeUser', { email: u.email })" @click="removeNewUser(u)">✕</button>
              </div>
              <div class="inline">
                <input class="admin-name" :placeholder="$t('admin.displayName')" x-model="u.name" :aria-label="$t('admin.nameOf', { email: u.email })">
                <select class="admin-member" x-model="u.member" :aria-label="$t('admin.memberOf', { email: u.email })">
                  <option value="" x-text="$t('admin.noLinkedMember')"></option>
                  <template x-for="m in memberOptions(u)" :key="m"><option :value="m" :selected="m === u.member" x-text="m"></option></template>
                </select>
              </div>
              <div class="chips" x-show="!u.is_admin">
                <template x-for="ev in draft.events" :key="ev.id">
                  <label class="check chip">
                    <input type="checkbox" class="admin-access" :checked="has(u.id, ev.id)" @change="toggle(u.id, ev.id)">
                    <span x-text="ev.name || '…'"></span>
                  </label>
                </template>
                <span class="muted" x-show="!draft.events.length" x-text="$t('admin.noEvents')"></span>
              </div>
              <span class="muted" x-show="u.is_admin" x-text="$t('admin.allEventsAccess')"></span>
            </li>
          </template>
        </ul>

        <form class="admin-add" id="admin-user-form" @submit.prevent="addUser()">
          <h3 x-text="$t('admin.addUser')"></h3>
          <div class="inline">
            <input type="email" name="user-email" :placeholder="$t('common.email')" x-model="newUser.email" required>
            <input type="password" name="user-password" :placeholder="$t('common.password')" autocomplete="new-password" x-model="newUser.password" required>
          </div>
          <div class="inline">
            <input name="user-name" :placeholder="$t('admin.displayNameOptional')" x-model="newUser.name">
            <select name="user-member" x-model="newUser.member">
              <option value="" x-text="$t('admin.noLinkedMember')"></option>
              <template x-for="m in memberOptions(null)" :key="m"><option :value="m" x-text="m"></option></template>
            </select>
            <button type="submit" x-text="$t('common.plusAdd')"></button>
          </div>
          <p class="hint" x-text="$t('admin.memberReplaceHint')"></p>
        </form>
      </div>
    </template>
  </section>

  <section class="card">
    <h2 x-text="$t('admin.events')"></h2>

    <template x-if="!editing">
      <ul class="admin-list" id="admin-events">
        <template x-for="ev in $store.admin.events" :key="ev.id">
          <li class="admin-row">
            <div class="admin-head">
              <b x-text="ev.name"></b>
              <span class="muted" x-text="$fmt.fmtDate(ev.date) || $t('common.noDate')"></span>
              <span class="muted" x-text="$t('common.expenseCount', { count: ev.expenseCount })"></span>
            </div>
            <div class="chips">
              <template x-for="u in usersOfEvent(ev.id)" :key="u.id"><span class="chip" x-text="u.name || u.email"></span></template>
              <span class="muted" x-show="!usersOfEvent(ev.id).length" x-text="$t('common.noPeople')"></span>
            </div>
          </li>
        </template>
        <li class="muted" x-show="!$store.admin.events.length" x-text="$t('collections.noEvents')"></li>
      </ul>
    </template>

    <template x-if="editing">
      <div>
        <ul class="admin-list" id="admin-events-edit">
          <template x-for="ev in draft.events" :key="ev.id">
            <li class="admin-row">
              <div class="inline">
                <input class="admin-event-name" x-model="ev.name" :aria-label="$t('admin.eventName')" required>
                <input type="date" x-model="ev.date" :aria-label="$t('common.date')">
                <span class="muted" x-text="$t('common.expenseCount', { count: ev.expenseCount })"></span>
                <button class="icon-btn" type="button" :aria-label="$t('common.deleteItem', { name: ev.name })" @click="removeEvent(ev)">🗑️</button>
              </div>
            </li>
          </template>
          <li class="muted" x-show="!draft.events.length" x-text="$t('collections.noEvents')"></li>
        </ul>
        <form class="inline admin-add" id="admin-event-form" @submit.prevent="addEvent()">
          <input name="event-name" :placeholder="$t('admin.eventName')" x-model="newEvent.name">
          <input type="date" name="event-date" x-model="newEvent.date">
          <button type="submit" x-text="$t('common.plusAdd')"></button>
        </form>
      </div>
    </template>
  </section>
</div>
