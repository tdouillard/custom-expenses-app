<section class="card collection-card" :id="kind + '-card'">
  <div class="card-head">
    <h2 x-text="$t(config.title)"></h2>
    <button class="icon-btn" :id="'edit-' + kind" :title="$t('common.editItem', { name: $t(config.title) })" :aria-label="$t('common.editItem', { name: $t(config.title) })"
            @click="edit()">✏️</button>
  </div>
  <ul class="item-list">
    <template x-for="row in rows" :key="row.index">
      <li class="item">
        <b x-text="row.item.name"></b>
        <template x-for="f in extraFields" :key="f.key">
          <span class="item-field">
            <template x-if="f.type === 'date'">
              <span class="muted" x-text="$fmt.fmtDate(row.item[f.key]) || $t('common.noDate')"></span>
            </template>
            <template x-if="f.type === 'user'">
              <span class="chips"><span class="chip" x-show="row.item[f.key]" x-text="$store.data.userLabel(row.item[f.key])"></span></span>
            </template>
            <template x-if="f.type === 'tags'">
              <span class="chips">
                <template x-for="p in row.item[f.key]" :key="p"><span class="chip" x-text="p"></span></template>
                <span class="muted" x-show="!row.item[f.key].length" x-text="$t('common.noPeople')"></span>
              </span>
            </template>
          </span>
        </template>
      </li>
    </template>
    <li class="muted" x-show="!rows.length" x-text="$t(config.emptyText)"></li>
  </ul>
</section>
