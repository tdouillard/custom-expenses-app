<dialog x-ref="dlg" id="expense-dlg">
  <template x-if="form">
    <form @submit.prevent="submit()" @input="recompute()" @change="recompute()">
      <h2 id="dlg-title" x-text="$t(form.id ? 'expense.edit' : 'expense.new')"></h2>
      <label><span x-text="$t('col.label')"></span> <input name="label" x-model="form.label" required></label>
      <label><span x-text="$t('expense.eventCategory')"></span>
        <select name="event" x-model="form.event" @change="onEventChange()">
          <template x-for="n in $store.data.eventNames" :key="n">
            <option :value="n" :selected="n === form.event" x-text="n"></option>
          </template>
          <option :value="NEW_EVENT" :selected="form.event === NEW_EVENT" x-text="$t('expense.newEventOption')"></option>
        </select>
      </label>
      <div class="new-event" x-show="form.event === NEW_EVENT">
        <label><span x-text="$t('expense.newEventName')"></span> <input name="newEvent" x-model="form.newEvent.name"></label>
        <label><span x-text="$t('common.date')"></span> <input name="newEventDate" type="date" x-model="form.newEvent.date"></label>
        <label><span x-text="$t('expense.peopleCommas')"></span> <input name="newEventPeople" x-model="form.newEvent.people"></label>
      </div>
      <label><span x-text="$t('expense.recipientOptional')"></span>
        <select name="recipient" x-model="form.recipient">
          <option value="" :selected="!form.recipient" x-text="$t('expenses.noRecipient')"></option>
          <template x-for="p in recipients" :key="p">
            <option :value="p" :selected="p === form.recipient" x-text="p"></option>
          </template>
        </select>
      </label>
      <label><span x-text="$t('col.paidBy')"></span>
        <select name="paidBy" x-model="form.paidBy">
          <template x-for="m in state.members" :key="m">
            <option :value="m" :selected="m === form.paidBy" x-text="m"></option>
          </template>
        </select>
      </label>
      <label><span x-text="$t('expense.amount')"></span> <input name="amount" type="number" step="0.01" min="0" required x-model="form.amount"></label>
      <label class="check"><input name="due" type="checkbox" x-model="form.due"> <span x-text="$t('expense.stillDue')"></span></label>
      <label><span x-text="$t('col.order')"></span>
        <select name="order" x-model="form.order">
          <template x-for="o in orders" :key="o.value">
            <option :value="o.value" :selected="o.value === form.order" x-text="$t(o.label)"></option>
          </template>
        </select>
      </label>
      <label><span x-text="$t('expense.comment')"></span> <input name="comment" x-model="form.comment"></label>
      <fieldset>
        <legend>
          <span x-text="$t('col.split')"></span>
          <select id="split-mode" x-model="form.mode">
            <option value="equal" :selected="form.mode === 'equal'" x-text="$t('expense.equal')"></option>
            <option value="custom" :selected="form.mode === 'custom'" x-text="$t('expense.custom')"></option>
          </select>
        </legend>
        <div id="split-rows">
          <template x-for="(s, m) in form.split" :key="m">
            <div class="split-row">
              <input type="checkbox" :data-m="m" :aria-label="$t('expense.participates', { name: m })" x-model="s.on">
              <span x-text="m"></span>
              <input type="number" step="0.01" min="0" :data-amt="m" :aria-label="$t('expense.shareOf', { name: m })"
                     x-model="s.amount" :readonly="form.mode === 'equal' || !s.on">
            </div>
          </template>
        </div>
        <div id="split-sum" class="hint" :class="{ neg: !splitMatches }"
             x-text="$t('expense.splitTotal', { split: $fmt.eur(splitTotal), amount: $fmt.eur(amount) })"></div>
      </fieldset>
      <div class="form-error" role="alert" id="expense-error" x-cloak x-show="error" x-text="error"></div>
      <menu>
        <button type="button" id="cancel-expense" @click="closeDialog()" x-text="$t('common.cancel')"></button>
        <button class="primary" type="submit" x-text="$t('common.save')"></button>
      </menu>
    </form>
  </template>
</dialog>
