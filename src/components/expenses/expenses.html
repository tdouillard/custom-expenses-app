<section class="card" id="expenses-card">
  <div class="card-head">
    <h2 x-text="$t('expenses.title')"></h2>
    <div class="head-actions">
      <button id="import-btn" @click="$dispatch('open-import')" x-text="$t('expenses.import')"></button>
    </div>
  </div>

  <div class="expenses-toolbar">
    <template x-if="eventColumn">
      <div class="toolbar-event" :aria-sort="ariaSort('event')">
        <details class="multi-filter" id="filter-event" @click.outside="$el.open = false">
          <summary :class="{ active: filters.event.length }" :aria-label="$t('expenses.filterEvent')" x-text="eventSummary()"></summary>
          <div class="multi-menu">
            <template x-for="o in optionsFor(eventColumn.filter.options)" :key="o.value">
              <label class="check">
                <input type="checkbox" :value="o.value" :checked="filters.event.includes(o.value)" @change="toggleEvent(o.value)">
                <span x-text="$t(o.label)"></span>
              </label>
            </template>
            <button type="button" class="link" x-show="filters.event.length" @click="filters.event = []" x-text="$t('expenses.showAll')"></button>
          </div>
        </details>
        <button type="button" class="sort-btn" :class="{ active: sortDir('event') }" data-sort="event"
                :title="$t('expenses.sortEvents')" :aria-label="$t('expenses.sortEvents')" @click="toggleSort('event')">
          <span x-text="$t('expenses.sortEvents')"></span>
          <span class="sort-arrow" aria-hidden="true" x-text="sortDir('event') === 'asc' ? '▲' : sortDir('event') === 'desc' ? '▼' : '↕'"></span>
        </button>
      </div>
    </template>
  </div>

  <div id="rows" class="event-groups">
    <template x-for="(g, gi) in groups" :key="g.event">
      <section class="event-group">
        <header class="group-head">
          <span class="group-name" x-text="'🗓️ ' + g.event"></span>
          <span class="muted" x-text="($fmt.fmtDate(g.date) || $t('common.noDate')) + ' · ' + $t('common.expenseCount', { count: g.rows.length })"></span>
          <b class="group-total" x-text="$fmt.eur(g.total)"></b>
        </header>

        <div class="table-wrap">
          <table class="expenses-table">
            <colgroup>
              <template x-for="col in columns" :key="col.key"><col :style="'width:' + col.width"></template>
            </colgroup>
            <thead x-show="gi === 0">
              <tr>
                <template x-for="col in columns" :key="col.key">
                  <th :class="'cell-' + col.cell" :aria-sort="col.sort ? ariaSort(col.key) : null">
                    <template x-if="col.filter">
                      <select class="th-filter" :id="'filter-' + col.filter.key" :class="{ active: filters[col.filter.key] }"
                              :aria-label="$t('expenses.filterBy', { label: $t(col.label) })" x-model="filters[col.filter.key]">
                        <option value="" :selected="!filters[col.filter.key]" x-text="$t(col.label)"></option>
                        <template x-for="o in optionsFor(col.filter.options)" :key="o.value">
                          <option :value="o.value" :selected="o.value === filters[col.filter.key]" x-text="$t(o.label)"></option>
                        </template>
                      </select>
                    </template>
                    <template x-if="!col.filter && !col.sort">
                      <span x-text="$t(col.label)"></span>
                    </template>
                    <template x-if="col.sort">
                      <button type="button" class="sort-btn" :class="{ active: sortDir(col.key) }" :data-sort="col.key"
                              :title="$t('expenses.sortBy', { label: $t(col.label) })" :aria-label="$t('expenses.sortBy', { label: $t(col.label) })" @click="toggleSort(col.key)">
                        <span x-show="!col.filter" x-text="$t(col.label)"></span>
                        <span class="sort-arrow" aria-hidden="true" x-text="sortDir(col.key) === 'asc' ? '▲' : sortDir(col.key) === 'desc' ? '▼' : '↕'"></span>
                      </button>
                    </template>
                  </th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template x-for="e in g.rows" :key="e.id">
                <tr :class="rowStatus(e)">
                  <template x-for="col in columns" :key="col.key">
                    <td :class="'cell-' + col.cell">
                      <template x-if="col.cell === 'label'">
                        <div>
                          <b x-text="e.label"></b>
                          <div class="sub" x-show="e.comment" x-text="e.comment"></div>
                        </div>
                      </template>
                      <template x-if="col.cell === 'payer'">
                        <span class="payer" x-show="e.paidBy">
                          <span class="avatar-sm" :style="avatarStyle(e.paidBy)" x-text="initials(e.paidBy)"></span>
                          <span x-text="e.paidBy"></span>
                        </span>
                      </template>
                      <template x-if="col.cell === 'recipient'">
                        <span>
                          <span class="for-tag" x-show="e.recipient" x-text="'🎁 ' + e.recipient"></span>
                          <span class="muted" x-show="!e.recipient">—</span>
                        </span>
                      </template>
                      <template x-if="col.cell === 'money'"><b x-text="$fmt.eur(e.amount)"></b></template>
                      <template x-if="col.cell === 'split'">
                        <div class="split-list">
                          <template x-for="m in participants(e)" :key="m">
                            <span class="chip"><span x-text="m"></span> <b x-text="$fmt.eur(e.split[m])"></b></span>
                          </template>
                        </div>
                      </template>
                      <template x-if="col.cell === 'payment'">
                        <span class="badge pill" :class="paymentInfo(e).cls"><i></i><span x-text="$t(paymentInfo(e).label)"></span></span>
                      </template>
                      <template x-if="col.cell === 'order'">
                        <span class="badge pill" :class="orderInfo(e.order).cls"><i></i><span x-text="$t(orderInfo(e.order).label)"></span></span>
                      </template>
                      <template x-if="col.cell === 'actions'">
                        <span class="row-actions">
                          <button class="link" :aria-label="$t('common.editItem', { name: e.label })" :data-edit="e.id" @click="edit(e)">✏️</button>
                          <button class="link" :aria-label="$t('common.deleteItem', { name: e.label })" :data-del="e.id" @click="remove(e)">🗑️</button>
                        </span>
                      </template>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>
    </template>
    <p class="muted" x-show="!rows.length" x-text="$t('expenses.empty')"></p>
  </div>

  <div class="expenses-total">
    <span x-text="$t('expenses.total')"></span>
    <b id="expenses-total" x-text="$fmt.eur(total)"></b>
  </div>
</section>
