<div class="forgot-password">
  <div x-show="step === 'email'" class="card forgot-card">
    <h2 x-text="$t('forgot.title')"></h2>
    <form @submit.prevent="sendReset()">
      <label><span x-text="$t('forgot.email')"></span>
        <input type="email" autocomplete="email" required x-model="email">
      </label>
      <p class="hint" x-text="$t('forgot.hint')"></p>
      <p class="ok" role="status" x-show="state.ok" x-text="state.ok"></p>
      <p class="form-error" role="alert" x-show="state.error" x-text="state.error"></p>
      <div class="button-group">
        <button class="primary" type="submit" :disabled="state.busy" x-text="$t('forgot.send')"></button>
        <a href="#" @click.prevent="location.hash = ''" x-text="$t('common.back')"></a>
      </div>
    </form>
  </div>

  <div x-show="step === 'wait'" class="card forgot-card">
    <h2 x-text="$t('forgot.sentTitle')"></h2>
    <p x-text="$t('forgot.sentText')"></p>
    <a href="#" @click.prevent="location.hash = ''" x-text="$t('forgot.backToLogin')"></a>
  </div>

  <div x-show="step === 'reset'" class="card forgot-card">
    <h2 x-text="$t('forgot.newTitle')"></h2>
    <form @submit.prevent="reset()">
      <label><span x-text="$t('forgot.newPassword')"></span>
        <input type="password" autocomplete="new-password" required minlength="6" x-model="password">
      </label>
      <label><span x-text="$t('forgot.confirmPassword')"></span>
        <input type="password" autocomplete="new-password" required x-model="confirm">
      </label>
      <p class="ok" role="status" x-show="state.ok" x-text="state.ok"></p>
      <p class="form-error" role="alert" x-show="state.error" x-text="state.error"></p>
      <button class="primary" type="submit" :disabled="state.busy" x-text="$t('forgot.change')"></button>
    </form>
  </div>

  <div x-show="step === 'done'" class="card forgot-card">
    <h2 x-text="$t('forgot.doneTitle')"></h2>
    <p x-text="$t('forgot.doneText')"></p>
  </div>
</div>
