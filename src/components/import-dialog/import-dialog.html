<dialog x-ref="dlg" id="import-dlg">
  <div class="stack-form">
    <h2 x-text="$t('import.title')"></h2>
    <p class="hint" x-text="$t('import.columns')"></p>
    <p class="muted" x-show="!$store.data.eventNames.length" x-text="$t('import.needEvent')"></p>
    <label><span x-text="$t('import.eventFor')"></span>
      <select name="event" x-model="event">
        <template x-for="n in $store.data.eventNames" :key="n">
          <option :value="n" :selected="n === event" x-text="n"></option>
        </template>
      </select>
    </label>
    <label><span x-text="$t('import.file')"></span>
      <input type="file" id="import-file" accept=".csv,text/csv" :disabled="!event" @change="pick($event)">
    </label>
    <div class="form-error" role="alert" id="import-error" x-cloak x-show="error" x-text="error"></div>
    <template x-if="result">
      <div class="form-info" role="status" id="import-result">
        <p x-text="$t('import.imported', { count: result.added })"></p>
        <template x-if="result.skipped.length">
          <div>
            <p x-text="$t('import.skipped')"></p>
            <ul><template x-for="s in result.skipped" :key="s"><li x-text="s"></li></template></ul>
          </div>
        </template>
      </div>
    </template>
    <menu><button class="primary" type="button" @click="closeDialog()" x-text="$t('common.close')"></button></menu>
  </div>
</dialog>
