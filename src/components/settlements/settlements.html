<section class="card" id="settlements-card">
  <div class="card-head">
    <h2>Remboursements</h2>
    <button class="icon-btn" id="add-settlement" title="Enregistrer un remboursement" aria-label="Enregistrer un remboursement"
            @click="$dispatch('open-settle')">＋</button>
  </div>
  <ul class="settle-list" id="settlements">
    <template x-for="(s, i) in $store.data.state.settlements" :key="i">
      <li class="settle-row">
        <span class="settle-who"><b x-text="s.from"></b><span class="arrow">→</span><b x-text="s.to"></b></span>
        <span class="settle-amt" x-text="$fmt.eur(s.amount)"></span>
        <span class="muted settle-date" x-text="$fmt.fmtDate(s.date)"></span>
        <button class="link" :aria-label="'Supprimer le remboursement ' + (i + 1)" @click="remove(i)">✕</button>
      </li>
    </template>
    <li class="muted" x-show="!$store.data.state.settlements.length">Aucun remboursement</li>
  </ul>
</section>
