<dialog x-ref="dlg" id="share-dlg" class="share-dlg">
  <h2 x-text="$t('sharing.title')"></h2>
  <p class="hint" x-text="$t('sharing.hint')"></p>
  <textarea id="share-text" x-ref="text" readonly rows="16" x-model="message" @focus="$el.select()" :aria-label="$t('sharing.message')"></textarea>
  <menu>
    <button type="button" id="share-close" @click="closeDialog()" x-text="$t('common.close')"></button>
    <button type="button" id="share-native" x-show="canShare" @click="share()" x-text="$t('sharing.native')"></button>
    <button class="primary" type="button" id="share-copy" @click="copy()" x-text="copied ? $t('sharing.copied') : $t('sharing.copy')"></button>
  </menu>
</dialog>
