<section class="card" x-data="{ cols: [
    { key: 'paid', label: 'Dépenses payées' },
    { key: 'share', label: 'Part des dépenses' },
    { key: 'sent', label: 'Remboursements versés' },
    { key: 'received', label: 'Remboursements reçus' },
  ] }">
  <h2>Totaux par membre</h2>
  <div class="table-wrap">
    <table id="totals">
      <thead>
        <tr>
          <th>Membre</th>
          <template x-for="c in cols" :key="c.key"><th x-text="c.label"></th></template>
          <th>Solde (projeté)</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="r in $store.data.totals.rows" :key="r.member">
          <tr>
            <td x-text="r.member"></td>
            <template x-for="c in cols" :key="c.key"><td x-text="$fmt.eur(r[c.key])"></td></template>
            <td :class="$fmt.signClass(r.balance)" x-text="$fmt.signedEur(r.balance)"></td>
          </tr>
        </template>
      </tbody>
      <tfoot>
        <tr>
          <td>Total</td>
          <template x-for="c in cols" :key="c.key"><td x-text="$fmt.eur($store.data.totals.total[c.key])"></td></template>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>
  <p class="hint">Inclut toutes les dépenses, qu'elles soient payées ou « à payer ».</p>
</section>
