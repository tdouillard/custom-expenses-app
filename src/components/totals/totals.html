<section class="card" x-data="{ cols: [
    { key: 'paid', label: 'totals.paid' },
    { key: 'share', label: 'totals.share' },
    { key: 'sent', label: 'totals.sent' },
    { key: 'received', label: 'totals.received' },
  ] }">
  <h2 x-text="$t('totals.title')"></h2>
  <div class="table-wrap">
    <table id="totals">
      <thead>
        <tr>
          <th x-text="$t('common.member')"></th>
          <template x-for="c in cols" :key="c.key"><th x-text="$t(c.label)"></th></template>
          <th x-text="$t('totals.projected')"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="r in $store.data.totals.rows" :key="r.member">
          <tr>
            <td x-text="r.member"></td>
            <template x-for="c in cols" :key="c.key"><td x-text="$fmt.eur(r[c.key])"></td></template>
            <td :class="$fmt.signClass(r.balance)" x-text="$fmt.signedEur(r.balance)"></td>
          </tr>
        </template>
      </tbody>
      <tfoot>
        <tr>
          <td x-text="$t('expenses.total')"></td>
          <template x-for="c in cols" :key="c.key"><td x-text="$fmt.eur($store.data.totals.total[c.key])"></td></template>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>
  <p class="hint" x-text="$t('totals.hint')"></p>
</section>
